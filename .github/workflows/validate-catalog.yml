name: Validate Codex skill catalog

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run offline fixture tests
        run: python3 -m unittest discover -s tests -v

      - name: Check generated compatibility fixture
        run: python3 scripts/generate_legacy_overlay.py --check tests/fixtures/valid-plugin

      - name: Fetch and inspect immutable package sources
        run: python3 scripts/validate_catalog.py --fetch
