name: Monitor Codex skill adapters

on:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: monitor-codex-skill-adapters
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Read packages and upstreams and write report
        id: monitor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/monitor_adapters.py --output "$RUNNER_TEMP/adapters-report.json"
          monitor_exit=$?
          set -e
          echo "exit_code=$monitor_exit" >> "$GITHUB_OUTPUT"

      - name: Reconcile one monitor issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/reconcile_monitor_issue.py --report "$RUNNER_TEMP/adapters-report.json"

      - name: Preserve monitor status
        env:
          MONITOR_EXIT: ${{ steps.monitor.outputs.exit_code }}
        run: exit "$MONITOR_EXIT"
